plugins {
    id 'fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // DummyMod requires the patched Baritone API that exposes per-instance client contexts.
    // Explicit properties always win so CI/local layouts can point at arbitrary artifacts.
    def baritoneApiJar = project.findProperty('baritoneApiJar') != null
            ? file(project.findProperty('baritoneApiJar'))
            : [
                file('../baritone/fabric/build/libs/baritone-api-fabric-1.17.0-dirty.jar'),
                file('../baritone/dist/baritone-api-fabric-1.17.0-dirty.jar'),
                file('libs/baritone-api-fabric-1.17.0-dirty.jar'),
                file('baritone-api-fabric-1.17.0-dirty.jar')
              ].find { it.exists() }

    if (baritoneApiJar == null || !baritoneApiJar.exists()) {
        throw new GradleException(
                "Patched Baritone API not found. Build ../baritone first or pass " +
                "-PbaritoneApiJar=/path/to/baritone-api-fabric-1.17.0-dirty.jar")
    }

    // The normal patched Fabric runtime is preferred. Standalone dirty builds are accepted
    // as fallbacks because Baritone's output filename can vary by build task/version.
    def baritoneRuntimeJar = project.findProperty('baritoneRuntimeJar') != null
            ? file(project.findProperty('baritoneRuntimeJar'))
            : [
                file('../baritone/fabric/build/libs/baritone-fabric-1.17.0-dirty.jar'),
                file('../baritone/fabric/build/libs/baritone-standalone-fabric-1.17.0-dirty.jar'),
                file('../baritone/fabric/build/libs/baritone-fabric-1.17.0-dirty-standalone.jar'),
                file('../baritone/dist/baritone-fabric-1.17.0-dirty.jar'),
                file('../baritone/dist/baritone-standalone-fabric-1.17.0-dirty.jar'),
                file('libs/baritone-fabric-1.17.0-dirty.jar'),
                file('libs/baritone-standalone-fabric-1.17.0-dirty.jar'),
                file('libs/baritone-fabric-1.17.0-dirty-standalone.jar'),
                file('baritone-fabric-1.17.0-dirty.jar'),
                file('baritone-standalone-fabric-1.17.0-dirty.jar'),
                file('baritone-fabric-1.17.0-dirty-standalone.jar')
              ].find { it.exists() }

    if (baritoneRuntimeJar == null || !baritoneRuntimeJar.exists()) {
        throw new GradleException(
                "Patched Fabric Baritone runtime not found. Expected " +
                "../baritone/fabric/build/libs/baritone-fabric-1.17.0-dirty.jar " +
                "(standalone dirty is also accepted), or pass " +
                "-PbaritoneRuntimeJar=/path/to/baritone-fabric-1.17.0-dirty.jar")
    }

    // Compile against the patched API and use the patched Fabric runtime in dev.
    // The runtime remains a separate required mod JAR; it is deliberately not nested in DummyMod.
    modCompileOnly files(baritoneApiJar)
    modRuntimeOnly files(baritoneRuntimeJar)
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
